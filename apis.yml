aid: firsthand
name: firsthand
description: 'firsthand is a healthcare company delivering peer-based support to individuals
  living with serious mental illness and substance use disorders, helping them access
  care, benefits, and community resources. Its guides and specialists have lived experience
  of mental illness, and its HITRUST r2-certified helpinghand platform coordinates care
  across states including Florida, Ohio, Michigan, Virginia, and Washington. firsthand is
  a portfolio company of GV (Google Ventures). This profile is maintained by the API
  Evangelist network; firsthand publishes no public developer API, SDK, or documentation
  surface at this time.'
